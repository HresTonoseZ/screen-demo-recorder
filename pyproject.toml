[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-demo-recorder"
version = "1.0.0"
description = "Record Windows monitors or regions and build configurable animated GIF demonstrations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HresTonoseZ" }]
dependencies = [
  "Pillow==12.3.0",
  "imageio-ffmpeg==0.6.0",
  "mss==10.2.0",
  "pynput==1.8.2",
  "PySide6==6.11.2",
]

[project.gui-scripts]
screen-demo-recorder = "screen_demo_recorder.app:main"

[tool.setuptools]
packages = ["screen_demo_recorder"]
